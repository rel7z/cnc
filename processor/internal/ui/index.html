<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNC Processor Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            padding: 2rem;
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            margin: 0;
            font-weight: 800;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin-top: 2rem;
        }

        .run-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(5px);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .run-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            background: rgba(255, 255, 255, 0.06);
        }

        .run-info {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .run-id {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .run-program {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .status-badge {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-queued { background: rgba(234, 179, 8, 0.2); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.5); }
        .status-running { background: rgba(56, 189, 248, 0.2); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.5); }
        .status-completed { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.5); }
        .status-failed { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.5); }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
        }

        .status-running .dot {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(56, 189, 248, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
        }

        .empty-state {
            text-align: center;
            color: #94a3b8;
            margin-top: 3rem;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>CNC Processor Dashboard</h1>
        <p>Real-time Task Monitoring</p>
    </div>

    <div class="container" id="runs-container">
        <div class="empty-state">Loading tasks...</div>
    </div>

    <script>
        async function fetchRuns() {
            try {
                const response = await fetch('/v1/runs');
                const runs = await response.json();
                const container = document.getElementById('runs-container');
                
                if (!runs || runs.length === 0) {
                    container.innerHTML = '<div class="empty-state">No tasks in queue.</div>';
                    return;
                }

                container.innerHTML = runs.map(run => `
                    <div class="run-card">
                        <div class="run-info">
                            <div class="run-id">${run.ID}</div>
                            <div class="run-program">Program: ${run.ProgramID}</div>
                        </div>
                        <div class="status-badge status-${run.Status}">
                            <div class="dot"></div>
                            ${run.Status.toUpperCase()}
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error("Error fetching runs:", error);
            }
        }

        // Poll every 2 seconds
        setInterval(fetchRuns, 2000);
        fetchRuns();
    </script>
</body>
</html>
